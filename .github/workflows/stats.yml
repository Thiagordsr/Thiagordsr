name: Generate stats card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The public renderer can query profile contributions that GITHUB_TOKEN cannot.
      # Keep the last published card if the service fails or returns an error SVG.
      - name: generate stats.svg
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github-readme-stats.vercel.app/api?username=${PROFILE_USER}&hide_title=true&hide_rank=false&show_icons=true&include_all_commits=true&disable_animations=true&theme=react&locale=pt-br&hide_border=true" \
            --output dist/stats.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("dist/stats.svg").getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg", "Invalid SVG"
          assert any(node.get("data-testid") == "stars" for node in root.iter()), "Stats service returned an error card"
          PY


      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
