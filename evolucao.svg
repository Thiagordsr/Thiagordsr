        cy="208"
        r="48"
        fill="#0a1c2c"
        stroke="#19374b"
        stroke-width="9"
    />

    <circle
        cx="90"
        cy="208"
        r="48"
        fill="none"
        stroke="url(#arc)"
        stroke-width="9"
        stroke-linecap="round"
        stroke-dasharray="180.956 301.593"
        transform="rotate(-90 90 208)"
    />

    <text
        x="90"
        y="218"
        text-anchor="middle"
        fill="#f1fbff"
        font-family="Arial,sans-serif"
        font-size="28"
        font-weight="700">
        60<tspan font-size="14" fill="#82a9bf">%</tspan>
    </text>

    <text
        x="90"
        y="297"
        text-anchor="middle"
        fill="#d9edf9"
        font-family="Arial,sans-serif"
        font-size="16"
        font-weight="600">
        Python
    </text>
</g>


