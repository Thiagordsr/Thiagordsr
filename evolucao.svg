<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">

<title id="title">Tecnologias em órbita</title>

<desc id="desc">
Familiaridade autoavaliada: Python 60%, Java 20%, JavaScript 30%, HTML 50%, CSS 40%, SQL 15%.
Cada círculo representa uma escala independente de zero a cem.
</desc>

<defs>
    <linearGradient id="bg" x2="1" y2="1">
        <stop stop-color="#081727"/>
        <stop offset="1" stop-color="#0c2236"/>
    </linearGradient>

    <linearGradient id="arc" x2="1" y2="1">
        <stop stop-color="#2dd4bf"/>
        <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
</defs>

<rect
    x="1"
    y="1"
    width="998"
    height="358"
    rx="24"
    fill="url(#bg)"
    stroke="#204258"
/>

<path
    d="M32 40h28"
    stroke="#2dd4bf"
    stroke-width="4"
    stroke-linecap="round"
/>

<text
    x="74"
    y="46"
    fill="#8edbdc"
    font-family="Arial,sans-serif"
    font-size="13"
    letter-spacing="3">
    THIAGO R. SANTA ROSA / DEV JOURNEY
</text>

<text
    x="32"
    y="90"
    fill="#eef8ff"
    font-family="Arial,sans-serif"
    font-size="29"
    font-weight="700">
    Tecnologias em órbita
</text>

<text
